name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config auto --error app.py

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Scan Python source
        run: bandit -r app.py -ll

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint Flask
      - name: Run Pylint
        run: pylint app.py --fail-under=8.0

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  stage1-summary:
    name: Stage 1 Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gitleaks
      - semgrep
      - bandit
      - hadolint
      - pylint
      - pip-audit
      - pytest
    steps:
      - name: Calculate and publish score
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          BANDIT: ${{ needs.bandit.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          PYLINT: ${{ needs.pylint.result }}
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: |
          python - <<'PY'
          import os

          checks = {
              "Gitleaks": os.environ["GITLEAKS"],
              "Semgrep": os.environ["SEMGREP"],
              "Bandit": os.environ["BANDIT"],
              "Hadolint": os.environ["HADOLINT"],
              "Pylint": os.environ["PYLINT"],
              "pip-audit": os.environ["PIP_AUDIT"],
              "pytest": os.environ["PYTEST"],
          }
          passed = sum(result == "success" for result in checks.values())
          score = round((passed / len(checks)) * 100)
          lines = [
              "## Stage 1 Security & Quality Summary",
              "",
              f"**Score: {score}/100 ({passed}/{len(checks)} checks passed)**",
              "",
              "| Check | Result |",
              "|---|---|",
          ]
          for name, result in checks.items():
              icon = "✅" if result == "success" else "❌"
              lines.append(f"| {name} | {icon} `{result}` |")
          lines.extend([
              "",
              "> Stage 1 reports the score. The PR score gate (for example, threshold >= 80) is planned for Stage 2.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  security-score-gate:
    name: Security Score Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gitleaks
      - semgrep
      - bandit
      - hadolint
      - pylint
      - pip-audit
      - pytest
    steps:
      - name: Calculate score and publish result
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const checks = [
              { id: "gitleaks",  name: "Gitleaks",  weight: 20, critical: true },
              { id: "semgrep",   name: "Semgrep",   weight: 15 },
              { id: "bandit",    name: "Bandit",    weight: 15 },
              { id: "pip-audit", name: "pip-audit", weight: 15 },
              { id: "pytest",    name: "pytest",    weight: 15 },
              { id: "pylint",    name: "Pylint",    weight: 10 },
              { id: "hadolint",  name: "Hadolint",  weight: 10 },
            ];
            const THRESHOLD = 80;

            let score = 0;
            let criticalFailed = false;
            const rows = checks.map((c) => {
              const result = needs[c.id].result;
              const ok = result === "success";
              if (ok) score += c.weight;
              if (c.critical && !ok) criticalFailed = true;
              const label = c.critical ? `${c.name} (critical)` : c.name;
              return `| ${label} | ${c.weight} | ${ok ? "✅" : "❌"} \`${result}\` | ${ok ? c.weight : 0} |`;
            });

            const passed = score >= THRESHOLD && !criticalFailed;
            let reason = `Score ${score} ≥ ${THRESHOLD} and no critical failure.`;
            if (criticalFailed) reason = "Secret leak detected: always blocked, regardless of score.";
            else if (!passed) reason = `Score ${score} is below the minimum of ${THRESHOLD}.`;

            const marker = "<!-- security-score-bot -->";
            const body = [
              marker,
              "## 🤖 Security Score Bot",
              "",
              `**Score: ${score}/100**: ${passed ? "✅ PASSED" : "⛔ BLOCKED"}`,
              "",
              reason,
              "",
              "| Check | Weight | Result | Points |",
              "|---|---|---|---|",
              ...rows,
              "",
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join("\n");

            await core.summary.addRaw(body, true).write();

            if (context.eventName === "pull_request") {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            if (!passed) core.setFailed(reason);
