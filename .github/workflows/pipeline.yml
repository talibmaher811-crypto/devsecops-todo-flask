name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

env:
  LOCAL_IMAGE: devsecops-todo-flask:ci

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config auto --error app.py

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Scan Python source
        run: bandit -r app.py -ll

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint Flask
      - name: Run Pylint
        run: pylint app.py --fail-under=8.0

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  stage1-summary:
    name: Stage 1 Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gitleaks
      - semgrep
      - bandit
      - hadolint
      - pylint
      - pip-audit
      - pytest
    steps:
      - name: Calculate and publish score
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          BANDIT: ${{ needs.bandit.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          PYLINT: ${{ needs.pylint.result }}
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: |
          python - <<'PY'
          import os

          checks = {
              "Gitleaks": os.environ["GITLEAKS"],
              "Semgrep": os.environ["SEMGREP"],
              "Bandit": os.environ["BANDIT"],
              "Hadolint": os.environ["HADOLINT"],
              "Pylint": os.environ["PYLINT"],
              "pip-audit": os.environ["PIP_AUDIT"],
              "pytest": os.environ["PYTEST"],
          }
          passed = sum(result == "success" for result in checks.values())
          score = round((passed / len(checks)) * 100)
          lines = [
              "## Stage 1 Security & Quality Summary",
              "",
              f"**Score: {score}/100 ({passed}/{len(checks)} checks passed)**",
              "",
              "| Check | Result |",
              "|---|---|",
          ]
          for name, result in checks.items():
              icon = "✅" if result == "success" else "❌"
              lines.append(f"| {name} | {icon} `{result}` |")
          lines.extend([
              "",
              "> Stage 1 reports the score. The PR score gate (for example, threshold >= 80) is planned for Stage 2.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  security-score-gate:
    name: Security Score Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gitleaks
      - semgrep
      - bandit
      - hadolint
      - pylint
      - pip-audit
      - pytest
    steps:
      - name: Calculate score and publish result
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const checks = [
              { id: "gitleaks",  name: "Gitleaks",  weight: 20, critical: true },
              { id: "semgrep",   name: "Semgrep",   weight: 15 },
              { id: "bandit",    name: "Bandit",    weight: 15 },
              { id: "pip-audit", name: "pip-audit", weight: 15 },
              { id: "pytest",    name: "pytest",    weight: 15 },
              { id: "pylint",    name: "Pylint",    weight: 10 },
              { id: "hadolint",  name: "Hadolint",  weight: 10 },
            ];
            const THRESHOLD = 80;

            let score = 0;
            let criticalFailed = false;
            const rows = checks.map((c) => {
              const result = needs[c.id].result;
              const ok = result === "success";
              if (ok) score += c.weight;
              if (c.critical && !ok) criticalFailed = true;
              const label = c.critical ? `${c.name} (critical)` : c.name;
              return `| ${label} | ${c.weight} | ${ok ? "✅" : "❌"} \`${result}\` | ${ok ? c.weight : 0} |`;
            });

            const passed = score >= THRESHOLD && !criticalFailed;
            let reason = `Score ${score} ≥ ${THRESHOLD} and no critical failure.`;
            if (criticalFailed) reason = "Secret leak detected: always blocked, regardless of score.";
            else if (!passed) reason = `Score ${score} is below the minimum of ${THRESHOLD}.`;

            const marker = "<!-- security-score-bot -->";
            const body = [
              marker,
              "## 🤖 Security Score Bot",
              "",
              `**Score: ${score}/100**: ${passed ? "✅ PASSED" : "⛔ BLOCKED"}`,
              "",
              reason,
              "",
              "| Check | Weight | Result | Points |",
              "|---|---|---|---|",
              ...rows,
              "",
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join("\n");

            await core.summary.addRaw(body, true).write();

            if (context.eventName === "pull_request") {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            if (!passed) core.setFailed(reason);

  # ---------------------------------------------------------------------------
  # Stage 3: Docker build, Trivy image scan, Syft SBOM, Cosign signing.
  # Only runs when the Stage 2 Security Score Gate passed.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security-score-gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
      - name: Smoke test container
        run: |
          docker run -d --name todo -p 5000:5000 "$LOCAL_IMAGE"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/ ; then echo; exit 0; fi
            sleep 1
          done
          docker logs todo
          exit 1
      - name: Save image for later jobs
        run: docker save "$LOCAL_IMAGE" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar
          retention-days: 1

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Load image
        run: docker load -i image.tar
      - name: Scan image (fail on HIGH/CRITICAL with a fix available)
        # Pinned to the full commit SHA of v0.35.0, the first release after the
        # March 2026 supply chain compromise. Do not use a mutable tag here.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: v0.69.3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: Syft SBOM
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Load image
        run: docker load -i image.tar
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  sign-publish:
    name: Publish & Cosign Sign
    runs-on: ubuntu-latest
    needs: [trivy, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Attach SBOM as signed attestation
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Summary
        run: |
          {
            echo "## Stage 3: Published & signed image"
            echo ""
            echo "- Image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Signed with Cosign (keyless) and SBOM attested"
            echo ""
            echo "Verify:"
            echo '```'
            echo "cosign verify ${IMAGE}@${{ steps.build.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 4: deploy to the lab machine (self-hosted runner), health check with
  # automatic rollback, then an OWASP ZAP baseline scan of the running app.
  # Only runs on push to main, after the image has been signed.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VM
    runs-on: [self-hosted, linux, devsecops-vm]
    needs: sign-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute image reference
        run: |
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}@${{ needs.sign-publish.outputs.digest }}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v3
      - name: Verify signature before deploying
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "Signature verified for $IMAGE_REF"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy with health check and rollback
        run: bash deploy/deploy.sh "$IMAGE_REF"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Stage 4: Deploy"
            echo ""
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Result: **${{ job.status }}**"
            echo "- URL on the VM: http://127.0.0.1:8080/"
          } >> "$GITHUB_STEP_SUMMARY"

  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: [self-hosted, linux, devsecops-vm]
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Prepare report directory
        run: |
          mkdir -p zap-out
          chmod 777 zap-out
      - name: Run ZAP baseline scan against the deployed app
        run: |
          docker run --rm --network host \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-out/zap-report.html
